zabbix_export:
  version: '8.0'
  template_groups:
    - uuid: 57b7ae836ca64446ba2c296389c009b7
      name: Templates/Modules
  templates:
    - uuid: b817818509524f42bba88f69fb0a8fae
      template: 'Shelly Mini 1PM Gen3'
      name: 'Shelly Mini 1PM Gen3'
      groups:
        - name: Templates/Modules
      items:
        - uuid: 736f173c244c41caa30521eade286902
          name: 'Wh consumed'
          type: DEPENDENT
          key: aenergy.total
          value_type: FLOAT
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$["switch:0"].aenergy.total'
              error_handler: DISCARD_VALUE
            - type: SIMPLE_CHANGE
          master_item:
            key: params
          tags:
            - tag: mqtt
        - uuid: 8f367090ddbe4031b7340d6e2847e8c0
          name: Power
          type: DEPENDENT
          key: apower
          value_type: FLOAT
          units: '!W'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.apower
          master_item:
            key: mqtt.switch0
          tags:
            - tag: mqtt
        - uuid: 7b0a1d104a994c448ce57dd5a1f9151b
          name: Current
          type: DEPENDENT
          key: current
          value_type: FLOAT
          units: A
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.current
          master_item:
            key: mqtt.switch0
          tags:
            - tag: mqtt
        - uuid: b44e43479c554743b27ab2381f48cb49
          name: Frequency
          type: DEPENDENT
          key: freq
          value_type: FLOAT
          units: '!Hz'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.freq
          master_item:
            key: mqtt.switch0
          tags:
            - tag: mqtt
        - uuid: 2676f1fbe3314e749d9a107d9eca2246
          name: kW
          type: DEPENDENT
          key: kW
          value_type: FLOAT
          units: '!kW'
          preprocessing:
            - type: MULTIPLIER
              parameters:
                - '0.001'
          master_item:
            key: aenergy.total
        - uuid: 4881cfac3fad4bf79e9e0036952c764e
          name: mqtt.events.rpc
          type: DEPENDENT
          key: mqtt.events.rpc
          value_type: LOG
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.["shelly1pmminig3-48f6eeb9375c/events/rpc"]'
              error_handler: DISCARD_VALUE
            - type: DISCARD_UNCHANGED
          master_item:
            key: 'mqtt.get[192.168.88.59:1883,"#",,]'
          tags:
            - tag: mqtt
        - uuid: 5c509eabd491487fac8aefb598362c5f
          name: 'shelly gen3 b'
          type: ZABBIX_ACTIVE
          key: 'mqtt.get[192.168.88.59:1883,"#",,]'
          value_type: LOG
          tags:
            - tag: mqtt
        - uuid: 0d85b35cd1474c608488b9ec83539107
          name: mqtt.switch0
          type: DEPENDENT
          key: mqtt.switch0
          value_type: LOG
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.["shelly1pmminig3-48f6eeb9375c/status/switch:0"]'
              error_handler: DISCARD_VALUE
            - type: DISCARD_UNCHANGED
          master_item:
            key: 'mqtt.get[192.168.88.59:1883,"#",,]'
          tags:
            - tag: mqtt
        - uuid: 0ae72d527cdf4c97898bb8d7732c5c83
          name: params
          type: DEPENDENT
          key: params
          value_type: LOG
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.params
          master_item:
            key: ret_aenergy
          tags:
            - tag: mqtt
        - uuid: caed5b408e554c299c2e3af6848aebfb
          name: 'Returned active energy'
          type: DEPENDENT
          key: ret_aenergy
          value_type: LOG
          preprocessing:
            - type: REGEX
              parameters:
                - '.*ret_aenergy.*'
                - \0
              error_handler: DISCARD_VALUE
          master_item:
            key: mqtt.events.rpc
          tags:
            - tag: mqtt
        - uuid: 1700f0c5a3164189ba5ef7b9c011529d
