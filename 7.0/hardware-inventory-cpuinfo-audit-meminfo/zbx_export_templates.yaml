zabbix_export:
  version: '7.0'
  template_groups:
    - uuid: 57b7ae836ca64446ba2c296389c009b7
      name: Templates/Modules
  templates:
    - uuid: 7097181da3ab4a239f7216da03dea83a
      template: 'hardware inventory cpuinfo partitions meminfo audit'
      name: 'hardware inventory cpuinfo partitions meminfo audit'
      groups:
        - name: Templates/Modules
      items:
        - uuid: fa054f5043c944db94b7dcf1e4d6acfc
          name: 'Inventory CPU model'
          type: DEPENDENT
          key: inventory.cpu.model
          delay: '0'
          value_type: CHAR
          trends: '0'
          inventory_link: MODEL
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  // extract "model name" or "CPU part" code
                  
                  // in case master item is stored in inventory, need to remove tabs and new line characters
                  var formated = value.replace(/\\t/gm, '').replace(/\\n/gm, '\n');
                  
                  // for x86_64
                  if (formated.match(/model nam.*: (.*)/)) { return formated.match(/model nam.*: (.*)/)[1]; }
                  
                  // for aarch64
                  if (formated.match(/CPU par.*: (.*)/)) { return formated.match(/CPU par.*: (.*)/)[1]; }
          master_item:
            key: 'vfs.file.contents[/proc/cpuinfo]'
          tags:
            - tag: audit
        - uuid: 6b266b02c9a44cb5aa373196070f4a2b
          name: 'Inventory CPUs'
          type: DEPENDENT
          key: inventory.cpus
          delay: '0'
          trends: '0'
          units: '!CPUs'
          inventory_link: POC_1_PHONE_A
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - 'return value.match(/^processor/gm).length;'
          master_item:
            key: 'vfs.file.contents[/proc/cpuinfo]'
          tags:
            - tag: audit
        - uuid: d893942d734648f9939e9e463f5821ae
          name: 'Inventory Operating system'
          type: DEPENDENT
          key: 'inventory[operating.system]'
          delay: '0'
          value_type: CHAR
          trends: '0'
          inventory_link: OS_SHORT
          preprocessing:
            - type: REGEX
              parameters:
                - 'PRETTY_NAME=.(.*).'
                - \1
            - type: STR_REPLACE
              parameters:
                - ' Server'
                - ''
            - type: STR_REPLACE
              parameters:
                - ' GNU/Linux'
                - ''
            - type: REGEX
              parameters:
                - '^(.*[0-9.]+)'
                - \1
          master_item:
            key: 'vfs.file.contents[/etc/os-release]'
          tags:
            - tag: audit
        - uuid: 839789cc23834b9ebc5eb3020813b909
          name: 'Inventory total disk size in bytes'
          type: DEPENDENT
          key: proc.partitions.0
          delay: '0'
          units: '!GB'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var input = value.match(/\d+\s+\d+\s+\d+\s+\S+/gm);
                  var out = [];
                  for (var n = 0; n < input.length; n++) {
                      var row = {};
                      row["disk"] = input[n].match(/\d+\s+\d+\s+\d+\s+(\S+)/)[1];
                      row["size"] = input[n].match(/\d+\s+\d+\s+(\d+)\s+\S+/)[1];
                      out.push(row);
                  }
                  return JSON.stringify(out);
            - type: JSONPATH
              parameters:
                - '$..[?(!(@.[''disk''] =~ "^sr" || @.[''disk''] =~ "^loop" || @.[''disk''] =~ "^dm" || @.[''disk''] =~ ''.*[0-9]$''))]'
              error_handler: CUSTOM_VALUE
              error_handler_params: '[]'
            - type: JSONPATH
              parameters:
                - '$[*].size.sum()'
            - type: MULTIPLIER
              parameters:
                - '0.0009765625'
            - type: MULTIPLIER
              parameters:
                - '0.0009765625'
          master_item:
            key: 'vfs.file.contents["/proc/partitions",]'
          tags:
            - tag: audit
        - uuid: 41ac1e47684240c6b8041a6b4c4b54fa
          name: 'inventory RAM'
          type: DEPENDENT
          key: totalMem
          delay: '0'
          trends: '0'
          units: B
          preprocessing:
            - type: REGEX
              parameters:
                - 'MemTotal:\s+(\d+) kB'
                - \1
            - type: MULTIPLIER
              parameters:
                - '1024'
          master_item:
            key: 'vfs.file.contents[/proc/meminfo]'
          tags:
            - tag: audit
        - uuid: a5a8db180af64cdf86ff9c3e24005b7e
          name: partitions
          type: ZABBIX_ACTIVE
          key: 'vfs.file.contents["/proc/partitions",]'
          delay: 0;s34
          history: '0'
          value_type: TEXT
          trends: '0'
          timeout: 1s
          tags:
            - tag: audit
        - uuid: f090dbb9322c4167b51266b9db6ca610
          name: os-release
          type: ZABBIX_ACTIVE
          key: 'vfs.file.contents[/etc/os-release]'
          delay: 0;s33
          history: '0'
          value_type: LOG
          trends: '0'
          timeout: 1s
          tags:
            - tag: audit
        - uuid: c41de4fb170d4a79ad68059a71f6c717
          name: cpuinfo
          type: ZABBIX_ACTIVE
          key: 'vfs.file.contents[/proc/cpuinfo]'
          delay: 0;s31
          history: '0'
          value_type: LOG
          trends: '0'
          timeout: 1s
          tags:
            - tag: audit
        - uuid: b2e4f83ff50049089ec583f2bc9d4195
          name: meminfo
          type: ZABBIX_ACTIVE
          key: 'vfs.file.contents[/proc/meminfo]'
          delay: 0;s32
          history: '0'
          value_type: LOG
          trends: '0'
          timeout: 1s
          tags:
            - tag: audit
      tags:
        - tag: summary
          value: hardware
      dashboards:
        - uuid: abad8908e2a7488288b596b449d542b9
          name: 'Hardware info'
          display_period: '3600'
          auto_start: 'NO'
          pages:
            - widgets:
                - type: tophosts
                  name: Info
                  width: '72'
                  height: '6'
                  fields:
                    - type: INTEGER
                      name: columns.0.aggregate_function
                      value: '0'
                    - type: STRING
                      name: columns.0.base_color
                      value: ''
                    - type: INTEGER
                      name: columns.0.data
                      value: '3'
                    - type: INTEGER
                      name: columns.0.decimal_places
                      value: '2'
                    - type: STRING
                      name: columns.0.name
                      value: CPUs
                    - type: STRING
                      name: columns.0.text
                      value: '{INVENTORY.POC.PRIMARY.PHONE.A}'
                    - type: INTEGER
                      name: columns.1.aggregate_function
                      value: '0'
                    - type: STRING
                      name: columns.1.base_color
                      value: ''
                    - type: INTEGER
                      name: columns.1.data
                      value: '3'
                    - type: INTEGER
                      name: columns.1.decimal_places
                      value: '2'
                    - type: STRING
                      name: columns.1.name
                      value: 'Operating system'
                    - type: STRING
                      name: columns.1.text
                      value: '{INVENTORY.OS.SHORT}'
                    - type: INTEGER
                      name: columns.2.aggregate_function
                      value: '0'
                    - type: STRING
                      name: columns.2.base_color
                      value: ''
                    - type: INTEGER
                      name: columns.2.data
                      value: '3'
                    - type: INTEGER
                      name: columns.2.decimal_places
                      value: '2'
                    - type: STRING
                      name: columns.2.name
                      value: 'CPU model'
                    - type: STRING
                      name: columns.2.text
                      value: '{INVENTORY.MODEL}'
                    - type: INTEGER
                      name: columns.3.aggregate_function
                      value: '0'
                    - type: STRING
                      name: columns.3.base_color
                      value: ''
                    - type: INTEGER
                      name: columns.3.data
                      value: '3'
                    - type: INTEGER
                      name: columns.3.decimal_places
                      value: '2'
                    - type: STRING
                      name: columns.3.name
                      value: 'Memory in GB'
                    - type: STRING
                      name: columns.3.text
                      value: '{INVENTORY.POC.PRIMARY.PHONE.B}'
                    - type: STRING
